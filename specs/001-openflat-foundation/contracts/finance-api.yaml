openapi: 3.1.0
info:
  title: OpenFlat Finance API
  version: 1.0.0
  description: |
    REST API for the Finance Tracker module.
    Manages shared household expenses and calculates debt settlement.
    No SignalR hub — settlement is computed on-demand per request.

servers:
  - url: https+http://finance-api
    description: Aspire service discovery endpoint

paths:
  /api/expenses:
    get:
      operationId: listExpenses
      summary: List all expenses in reverse chronological order
      description: Returns all expenses with user info (FR-021).
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Current user ID (1–5)
      responses:
        '200':
          description: All expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseDto'

    post:
      operationId: createExpense
      summary: Log a new expense
      description: Creates an expense attributed to the current user (FR-020).
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
      responses:
        '201':
          description: Expense created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseDto'
        '400':
          description: Validation error (zero/negative amount, empty description) (FR-030)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/expenses/{expenseId}:
    parameters:
      - name: expenseId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getExpense
      summary: Get a single expense
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Expense details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseDto'
        '404':
          description: Expense not found

    put:
      operationId: updateExpense
      summary: Edit own expense
      description: |
        Only the logging user can edit their own expense (FR-020a, FR-020c).
        Settlement recalculates on next GET /api/settlement.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExpenseRequest'
      responses:
        '200':
          description: Expense updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseDto'
        '400':
          description: Validation error (zero/negative amount, empty description)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Not the author — cannot edit another user's expense
        '404':
          description: Expense not found

    delete:
      operationId: deleteExpense
      summary: Delete own expense
      description: |
        Only the logging user can delete their own expense (FR-020b, FR-020c).
        Settlement recalculates on next GET /api/settlement.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Expense deleted
        '403':
          description: Not the author — cannot delete another user's expense
        '404':
          description: Expense not found

  /api/settlement:
    get:
      operationId: getSettlement
      summary: Calculate the current debt settlement
      description: |
        Computes an even 5-way split of all expenses and returns minimized
        debt transactions using greedy net-balance matching (FR-022, FR-023, FR-024).

        Algorithm:
        1. Sum all expenses per user (total_paid)
        2. Compute fair share = grand_total / 5
        3. Net balance per user = total_paid - fair_share
        4. Greedy match: max-debtor pays max-creditor min(|debt|, credit)
        5. At most 4 transactions for 5 users

        All amounts in EUR cents internally; returned as EUR with 2 decimal places.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Settlement calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'

components:
  schemas:
    ExpenseDto:
      type: object
      required: [id, amountEur, description, loggedByUserId, loggedByUserName, createdAt, updatedAt, isOwn]
      properties:
        id:
          type: string
          format: uuid
        amountEur:
          type: number
          format: double
          description: Amount in EUR (e.g., 45.50). Stored as cents internally.
          minimum: 0.01
        description:
          type: string
          maxLength: 500
        loggedByUserId:
          type: integer
        loggedByUserName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isOwn:
          type: boolean
          description: True if this expense belongs to the requesting user (controls edit/delete visibility)

    CreateExpenseRequest:
      type: object
      required: [amountEur, description]
      properties:
        amountEur:
          type: number
          format: double
          minimum: 0.01
          description: Amount in EUR (e.g., 45.50). Will be stored as integer cents.
        description:
          type: string
          minLength: 1
          maxLength: 500

    UpdateExpenseRequest:
      type: object
      required: [amountEur, description]
      properties:
        amountEur:
          type: number
          format: double
          minimum: 0.01
        description:
          type: string
          minLength: 1
          maxLength: 500

    SettlementResponse:
      type: object
      required: [isSettled, transactions, balances, totalExpenses]
      properties:
        isSettled:
          type: boolean
          description: True if all users are settled (no outstanding debts) (FR-024)
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/SettlementTransaction'
          description: Minimized list of who-pays-whom. Empty if isSettled is true.
        balances:
          type: array
          items:
            $ref: '#/components/schemas/UserBalance'
          description: Net balance per user (positive = owed money, negative = owes money)
        totalExpenses:
          type: number
          format: double
          description: Grand total of all expenses in EUR
        fairShare:
          type: number
          format: double
          description: Per-person share (totalExpenses / 5)

    SettlementTransaction:
      type: object
      required: [fromUserId, fromUserName, toUserId, toUserName, amountEur]
      properties:
        fromUserId:
          type: integer
          description: User who owes money (debtor)
        fromUserName:
          type: string
        toUserId:
          type: integer
          description: User who is owed money (creditor)
        toUserName:
          type: string
        amountEur:
          type: number
          format: double
          description: Amount to transfer in EUR
          minimum: 0.01

    UserBalance:
      type: object
      required: [userId, userName, totalPaidEur, netBalanceEur]
      properties:
        userId:
          type: integer
        userName:
          type: string
        totalPaidEur:
          type: number
          format: double
          description: Total the user has paid
        netBalanceEur:
          type: number
          format: double
          description: Positive = is owed, Negative = owes others

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  # No SignalR Hub for Finance API
  # Settlement is calculated on-demand (GET /api/settlement)
  # If real-time is needed later, a FinanceHub can be added
