openapi: 3.1.0
info:
  title: OpenFlat Shopping API
  version: 1.0.0
  description: |
    REST API for the Shopping List module.
    Manages shopping items (add, edit, check-off, undo) and item comments.
    Items auto-clear from "Recently Bought" after 7 days.
    Real-time updates via SignalR hub at /hubs/shopping.

servers:
  - url: https+http://shopping-api
    description: Aspire service discovery endpoint

paths:
  /api/items:
    get:
      operationId: listItems
      summary: List all shopping items
      description: |
        Returns active items and recently bought items (FR-016, FR-019).
        Items bought more than 7 days ago are auto-cleared and not returned (FR-019b).
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 5
      responses:
        '200':
          description: Items grouped by status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListResponse'

    post:
      operationId: createItem
      summary: Add a new shopping item
      description: Creates an item in the active list (FR-017).
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDto'
        '400':
          description: Validation error (empty name, non-positive quantity) (FR-031)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getItem
      summary: Get a single item with comments
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item with comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetailDto'
        '404':
          description: Item not found

    put:
      operationId: updateItem
      summary: Edit an active item's name and quantity
      description: |
        Only allowed on active items (isBought = false) (FR-017a).
        Returns 409 if item is already bought.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
      responses:
        '200':
          description: Item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDto'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Item not found
        '409':
          description: Item is already bought — cannot edit

  /api/items/{itemId}/buy:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: buyItem
      summary: Check off an item (move to Recently Bought)
      description: |
        Sets isBought = true, records boughtAt timestamp and buyer (FR-018).
        Broadcasts via SignalR ShoppingHub.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item checked off
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDto'
        '404':
          description: Item not found
        '409':
          description: Item is already bought

  /api/items/{itemId}/undo:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: undoBuyItem
      summary: Move item back from Recently Bought to active list
      description: |
        Resets isBought to false, clears boughtAt and boughtByUserId (FR-019a).
        Broadcasts via SignalR ShoppingHub.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item moved back to active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDto'
        '404':
          description: Item not found
        '409':
          description: Item is not bought — cannot undo

  /api/items/{itemId}/comments:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listItemComments
      summary: List comments for a shopping item
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Comments in chronological order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentDto'
        '404':
          description: Item not found

    post:
      operationId: addItemComment
      summary: Add a comment to a shopping item
      description: Creates a comment on a shopping item (FR-025).
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentDto'
        '400':
          description: Empty comment text (FR-032)
        '404':
          description: Item not found

  /api/items/{itemId}/comments/{commentId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: commentId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    put:
      operationId: updateItemComment
      summary: Edit own comment
      description: Only the author can edit (FR-027, FR-028).
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
      responses:
        '200':
          description: Comment updated, isEdited set to true (FR-029)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentDto'
        '400':
          description: Empty comment text
        '403':
          description: Not the author
        '404':
          description: Comment not found

    delete:
      operationId: deleteItemComment
      summary: Delete own comment
      description: Only the author can delete (FR-027, FR-028).
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Comment deleted
        '403':
          description: Not the author
        '404':
          description: Comment not found

components:
  schemas:
    ShoppingListResponse:
      type: object
      required: [active, recentlyBought]
      properties:
        active:
          type: array
          items:
            $ref: '#/components/schemas/ItemDto'
          description: Items not yet bought
        recentlyBought:
          type: array
          items:
            $ref: '#/components/schemas/ItemDto'
          description: Items bought within the last 7 days

    ItemDto:
      type: object
      required: [id, name, quantity, addedByUserId, addedByUserName, isBought, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        quantity:
          type: integer
          minimum: 1
        addedByUserId:
          type: integer
        addedByUserName:
          type: string
        isBought:
          type: boolean
        boughtAt:
          type: string
          format: date-time
          nullable: true
        boughtByUserId:
          type: integer
          nullable: true
        boughtByUserName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        commentCount:
          type: integer
          description: Number of comments on this item

    ItemDetailDto:
      allOf:
        - $ref: '#/components/schemas/ItemDto'
        - type: object
          properties:
            comments:
              type: array
              items:
                $ref: '#/components/schemas/CommentDto'

    CreateItemRequest:
      type: object
      required: [name, quantity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        quantity:
          type: integer
          minimum: 1

    UpdateItemRequest:
      type: object
      required: [name, quantity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        quantity:
          type: integer
          minimum: 1

    CommentDto:
      type: object
      required: [id, userId, userName, text, isEdited, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: integer
        userName:
          type: string
        text:
          type: string
        isEdited:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCommentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000

    UpdateCommentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  # SignalR Hub (not REST — documented here for completeness)
  # Hub URL: /hubs/shopping
  # Client methods:
  #   ItemCreated(ItemDto item)
  #   ItemUpdated(ItemDto item)
  #   ItemBought(ItemDto item)
  #   ItemUndone(ItemDto item)
  #   ItemAutoCleared(Guid itemId)
  #   CommentAdded(Guid itemId, CommentDto comment)
  #   CommentUpdated(Guid itemId, CommentDto comment)
  #   CommentDeleted(Guid itemId, Guid commentId)
