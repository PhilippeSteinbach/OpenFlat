openapi: 3.1.0
info:
  title: OpenFlat Cleaning API
  version: 2.0.0
  description: |
    REST API for the Cleaning Checklist module (gamified checklist).
    Manages tasks with due dates, done/undone toggle, points, and task comments.
    Real-time updates via SignalR hub at /hubs/cleaning.
    
    REDESIGNED (v2): Replaced 4-column Kanban board with simple checklist.
    Tasks have a due date and done/undone state instead of status columns.

servers:
  - url: https+http://cleaning-api
    description: Aspire service discovery endpoint

paths:
  /api/tasks:
    get:
      operationId: listTasks
      summary: List all cleaning tasks
      description: |
        Returns all cleaning tasks sorted by urgency:
        active tasks first (overdue → due soon → no deadline), then completed tasks.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Current user ID (1–5)
      responses:
        '200':
          description: All tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskDto'

    post:
      operationId: createTask
      summary: Create a new cleaning task
      description: Creates a task with title, points, optional due date, and optional assignee.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDto'
        '400':
          description: Validation error (empty title, negative points)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getTask
      summary: Get a single task with comments
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task with comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailDto'
        '404':
          description: Task not found

    put:
      operationId: updateTask
      summary: Update task title, points, and/or due date
      description: |
        Edit a task's title, point value, and due date.
        If task is done and points change, assigned user's score is recalculated.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDto'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Task not found

    delete:
      operationId: deleteTask
      summary: Delete a task
      description: |
        Delete a task. If task was done, deduct points from assigned user.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Task deleted
        '404':
          description: Task not found

  /api/tasks/{taskId}/complete:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: completeTask
      summary: Toggle task done/undone
      description: |
        Toggles the task's completion state. When marking done:
        - Sets isDone=true, completedAt=now
        - If assignee exists, credits points
        - If no assignee, returns warningNoAssignee=true
        When marking undone:
        - Sets isDone=false, completedAt=null
        - If assignee exists, deducts points
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task completion toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteTaskResponse'
        '404':
          description: Task not found

  /api/tasks/{taskId}/assign:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: assignTask
      summary: Assign or unassign a user to a task
      description: Assign one of the 5 predefined users or unassign.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTaskRequest'
      responses:
        '200':
          description: Assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDto'
        '400':
          description: Invalid user ID
        '404':
          description: Task not found

  /api/tasks/{taskId}/comments:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listTaskComments
      summary: List comments for a task
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Comments in chronological order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentDto'
        '404':
          description: Task not found

    post:
      operationId: addTaskComment
      summary: Add a comment to a task
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentDto'
        '400':
          description: Empty comment text
        '404':
          description: Task not found

  /api/tasks/{taskId}/comments/{commentId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: commentId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    put:
      operationId: updateTaskComment
      summary: Edit own comment
      description: Only the author can edit.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
      responses:
        '200':
          description: Comment updated, isEdited set to true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentDto'
        '400':
          description: Empty comment text
        '403':
          description: Not the author
        '404':
          description: Comment not found

    delete:
      operationId: deleteTaskComment
      summary: Delete own comment
      description: Only the author can delete.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Comment deleted
        '403':
          description: Not the author
        '404':
          description: Comment not found

  /api/leaderboard:
    get:
      operationId: getLeaderboard
      summary: Get points leaderboard
      description: |
        Returns total points for each of the 5 users, sorted descending.
        Points are calculated from completed tasks (isDone=true) with an assigned user.
      responses:
        '200':
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntryDto'

components:
  schemas:
    TaskDto:
      type: object
      required: [id, title, points, isDone, createdByUserId, createdAt, updatedAt, commentCount]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        points:
          type: integer
          minimum: 0
        isDone:
          type: boolean
          description: Whether the task is completed
        dueDate:
          type: string
          format: date
          nullable: true
          description: Due date (YYYY-MM-DD) or null if no deadline
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: When the task was marked done
        assignedUserId:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
        assignedUserName:
          type: string
          nullable: true
          description: Display name of the responsible person
        createdByUserId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        commentCount:
          type: integer
          description: Number of comments on this task

    TaskDetailDto:
      allOf:
        - $ref: '#/components/schemas/TaskDto'
        - type: object
          properties:
            comments:
              type: array
              items:
                $ref: '#/components/schemas/CommentDto'

    CreateTaskRequest:
      type: object
      required: [title, points]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        points:
          type: integer
          minimum: 0
        dueDate:
          type: string
          format: date
          nullable: true
          description: Optional due date (YYYY-MM-DD)
        assignedUserId:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: Optional initial assignee

    UpdateTaskRequest:
      type: object
      required: [title, points]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        points:
          type: integer
          minimum: 0
        dueDate:
          type: string
          format: date
          nullable: true
          description: Due date or null to remove deadline

    CompleteTaskResponse:
      type: object
      required: [task, pointsDelta]
      properties:
        task:
          $ref: '#/components/schemas/TaskDto'
        pointsDelta:
          type: integer
          description: Points credited (+) or deducted (-). Zero if no assignee.
        warningNoAssignee:
          type: boolean
          description: True if completed without an assignee

    AssignTaskRequest:
      type: object
      properties:
        assignedUserId:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: User ID to assign, or null to unassign

    CommentDto:
      type: object
      required: [id, userId, userName, text, isEdited, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: integer
        userName:
          type: string
        text:
          type: string
        isEdited:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCommentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000

    UpdateCommentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000

    LeaderboardEntryDto:
      type: object
      required: [userId, userName, role, totalPoints]
      properties:
        userId:
          type: integer
        userName:
          type: string
        role:
          type: string
          enum: [Coordinator, Resident]
        totalPoints:
          type: integer

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  # SignalR Hub (not REST — documented here for completeness)
  # Hub URL: /hubs/cleaning
  # Client methods:
  #   TaskCreated(TaskDto task)
  #   TaskUpdated(TaskDto task)
  #   TaskDeleted(Guid taskId)
  #   TaskCompleted(CompleteTaskResponse response)
  #   TaskUncompleted(CompleteTaskResponse response)
  #   TaskAssigned(TaskDto task)
  #   CommentAdded(Guid taskId, CommentDto comment)
  #   CommentUpdated(Guid taskId, CommentDto comment)
  #   CommentDeleted(Guid taskId, Guid commentId)
  #   LeaderboardUpdated(LeaderboardEntryDto[] leaderboard)
