openapi: 3.1.0
info:
  title: OpenFlat Cleaning API
  version: 3.0.0
  description: |
    REST API for the Cleaning Checklist module (recurring tasks with rotation).
    Tasks recur on a frequency (every X days/weeks) and rotate among household members.
    Points go to the completer, not the assigned user. Real-time updates via SignalR.
    
    v3: Recurring tasks, effort presets, round-robin rotation, completion log.
    v2: Simple checklist (done/undone toggle).
    v1: 4-column Kanban board.

servers:
  - url: https+http://cleaning-api
    description: Aspire service discovery endpoint

paths:
  /api/tasks:
    get:
      operationId: listTasks
      summary: List all cleaning tasks
      description: |
        Returns all cleaning tasks sorted by urgency:
        active tasks first (overdue → due soon → no deadline), then completed tasks.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Current user ID (1–5)
      responses:
        '200':
          description: All tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskDto'

    post:
      operationId: createTask
      summary: Create a new recurring cleaning task
      description: |
        Creates a recurring task with title, effort preset, frequency, first due date,
        and optional rotation order (round-robin user list).
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDto'
        '400':
          description: Validation error (empty title, negative points)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getTask
      summary: Get a single task with comments
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task with comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailDto'
        '404':
          description: Task not found

    put:
      operationId: updateTask
      summary: Update task properties (effort, frequency, rotation, etc.)
      description: |
        Edit a recurring task's title, effort preset, frequency, due date, and rotation order.
        When effort changes, points are auto-recalculated from the preset (unless Custom).
        Changing rotation order resets the rotation index to 0.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDto'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Task not found

    delete:
      operationId: deleteTask
      summary: Delete a task
      description: |
        Delete a recurring task. Cascades to completion_log entries, removing associated historical points from leaderboard totals.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Task deleted
        '404':
          description: Task not found

  /api/tasks/{taskId}/complete:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: completeTask
      summary: Complete a recurring task
      description: |
        One-way completion (no undo). Logs completion, credits points to the
        completer (X-User-Id), advances rotation, and sets next due date.
        If completing for someone else, optionally provide nextUserId to
        pick who is next in rotation instead of the natural next.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTaskRequest'
      responses:
        '200':
          description: Task completed and advanced to next cycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteTaskResponse'
        '404':
          description: Task not found

  /api/tasks/{taskId}/assign:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      operationId: assignTask
      summary: Manually assign or unassign a user to a task (override rotation)
      description: |
        Manually assign one of the 5 predefined users or unassign, overriding the
        rotation-derived assignment. Use for ad-hoc corrections; standard assignment
        flows through rotation on completion (POST /complete) or rotation order
        changes (PUT /tasks/{taskId}).
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTaskRequest'
      responses:
        '200':
          description: Assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDto'
        '400':
          description: Invalid user ID
        '404':
          description: Task not found

  /api/tasks/{taskId}/comments:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: listTaskComments
      summary: List comments for a task
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Comments in chronological order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentDto'
        '404':
          description: Task not found

    post:
      operationId: addTaskComment
      summary: Add a comment to a task
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentDto'
        '400':
          description: Empty comment text
        '404':
          description: Task not found

  /api/tasks/{taskId}/comments/{commentId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: commentId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    put:
      operationId: updateTaskComment
      summary: Edit own comment
      description: Only the author can edit.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
      responses:
        '200':
          description: Comment updated, isEdited set to true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentDto'
        '400':
          description: Empty comment text
        '403':
          description: Not the author
        '404':
          description: Comment not found

    delete:
      operationId: deleteTaskComment
      summary: Delete own comment
      description: Only the author can delete.
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Comment deleted
        '403':
          description: Not the author
        '404':
          description: Comment not found

  /api/leaderboard:
    get:
      operationId: getLeaderboard
      summary: Get points leaderboard
      description: |
        Returns total points for each of the 5 users, sorted descending.
        Points are aggregated from the completion_log table for accuracy across rotations.
      responses:
        '200':
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntryDto'

components:
  schemas:
    TaskDto:
      type: object
      required: [id, title, effort, points, frequencyValue, frequencyUnit, dueDate, rotationOrder, rotationIndex, createdByUserId, createdAt, updatedAt, commentCount]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        effort:
          type: string
          enum: [None, Normal, Big, Huge, Custom]
          description: Effort preset
        points:
          type: integer
          minimum: 0
          description: Point value (auto-set by effort or custom)
        frequencyValue:
          type: integer
          minimum: 1
          description: How often the task recurs (number)
        frequencyUnit:
          type: string
          enum: [Days, Weeks]
          description: Recurrence unit
        dueDate:
          type: string
          format: date
          description: Current cycle due date (YYYY-MM-DD)
        rotationOrder:
          type: array
          items:
            type: integer
          description: Ordered list of user IDs for round-robin
        rotationIndex:
          type: integer
          description: Current index in rotation_order
        assignedUserId:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
        assignedUserName:
          type: string
          nullable: true
          description: Display name of currently assigned person
        lastCompletedAt:
          type: string
          format: date-time
          nullable: true
          description: When this task was last completed
        lastCompletedByUserName:
          type: string
          nullable: true
          description: Who last completed this task
        createdByUserId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        commentCount:
          type: integer
          description: Number of comments on this task

    TaskDetailDto:
      allOf:
        - $ref: '#/components/schemas/TaskDto'
        - type: object
          properties:
            comments:
              type: array
              items:
                $ref: '#/components/schemas/CommentDto'

    CreateTaskRequest:
      type: object
      required: [title, effort, frequencyValue, frequencyUnit, firstDueDate]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        effort:
          type: string
          enum: [None, Normal, Big, Huge, Custom]
        points:
          type: integer
          minimum: 0
          description: Required when effort is Custom, ignored otherwise
        frequencyValue:
          type: integer
          minimum: 1
          description: Recurrence number (e.g., 3 for "every 3 days")
        frequencyUnit:
          type: string
          enum: [Days, Weeks]
        firstDueDate:
          type: string
          format: date
          description: First due date (YYYY-MM-DD)
        rotationOrder:
          type: array
          items:
            type: integer
          description: Optional user IDs for round-robin rotation

    UpdateTaskRequest:
      type: object
      required: [title, effort, frequencyValue, frequencyUnit]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        effort:
          type: string
          enum: [None, Normal, Big, Huge, Custom]
        points:
          type: integer
          minimum: 0
          description: Required when effort is Custom
        frequencyValue:
          type: integer
          minimum: 1
        frequencyUnit:
          type: string
          enum: [Days, Weeks]
        dueDate:
          type: string
          format: date
          description: Override current due date
        rotationOrder:
          type: array
          items:
            type: integer
          description: Updated rotation (resets rotation_index to 0)

    CompleteTaskRequest:
      type: object
      properties:
        nextUserId:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: |
            When completing for someone else, pick who is next in rotation.
            If null/omitted, the natural next in rotation_order is used.

    CompleteTaskResponse:
      type: object
      required: [task, pointsEarned, completedByUserName]
      properties:
        task:
          $ref: '#/components/schemas/TaskDto'
        pointsEarned:
          type: integer
          description: Points credited to the completer
        completedByUserName:
          type: string
          description: Name of the user who completed the task
        nextAssignedUserName:
          type: string
          nullable: true
          description: Who is now assigned in the next cycle

    AssignTaskRequest:
      type: object
      properties:
        assignedUserId:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: User ID to assign, or null to unassign

    CommentDto:
      type: object
      required: [id, userId, userName, text, isEdited, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: integer
        userName:
          type: string
        text:
          type: string
        isEdited:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCommentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000

    UpdateCommentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000

    LeaderboardEntryDto:
      type: object
      required: [userId, userName, role, totalPoints]
      properties:
        userId:
          type: integer
        userName:
          type: string
        role:
          type: string
          enum: [Coordinator, Resident]
        totalPoints:
          type: integer

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  # SignalR Hub (not REST — documented here for completeness)
  # Hub URL: /hubs/cleaning
  # Client methods:
  #   TaskCreated(TaskDto task)
  #   TaskUpdated(TaskDto task)
  #   TaskDeleted(Guid taskId)
  #   TaskCompleted(CompleteTaskResponse response)   — one-way, no undo
  #   TaskAssigned(TaskDto task)
  #   CommentAdded(Guid taskId, CommentDto comment)
  #   CommentUpdated(Guid taskId, CommentDto comment)
  #   CommentDeleted(Guid taskId, Guid commentId)
  #   LeaderboardUpdated(LeaderboardEntryDto[] leaderboard)
